[project]
name = "wheelguard"
version = "0.2.1"
description = "A policy-aware, outage-resistant Python package index proxy"
readme = "README.md"
license = "Apache-2.0"
authors = [
    { name = "Brent Wilkins", email = "218822+BrentWilkins@users.noreply.github.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "packaging>=26.3",
    "python-multipart>=0.0.32",
    "uvicorn>=0.52.4",
]

[project.optional-dependencies]
azure = [
    "aiohttp>=3.9.0",
    "azure-identity>=1.25.1",
    "azure-storage-blob>=12.28.0",
    "psycopg[binary]>=3.3.2",
    "pyjwt[crypto]>=2.10.1",
]

[project.scripts]
wheelguard = "wheelguard.cli:main"
wheelguard-migrate = "wheelguard.migrate:main"
wheelguard-refresh-advisories = "wheelguard.refresh_job:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "aiohttp>=3.9.0",
    "azure-identity>=1.25.1",
    "azure-storage-blob>=12.28.0",
    "bandit>=1.9.4",
    "mypy>=2.3.1",
    "pip-audit>=2.10.1",
    "pytest>=9.1.1",
    "psycopg[binary]>=3.3.2",
    "pyjwt[crypto]>=2.10.1",
    "ruff>=0.16.5",
    "workers-py>=1.17.1",
    "workers-runtime-sdk>=1.8.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
extend-exclude = ["src/js-stubs"]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "D"]

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]
"src/wheelguard/admin_service.py" = ["D102", "D107"]
"src/wheelguard/application.py" = ["E501"] # Embedded administrator HTML/JavaScript.
"src/wheelguard/azure_artifacts.py" = ["D102", "D107"]
"src/wheelguard/azure_storage.py" = ["D102", "D105", "D107"]
"src/wheelguard/postgres.py" = ["D102", "D107"]
"src/wheelguard/private_service.py" = ["D102", "D107"]

[tool.mypy]
strict = true
packages = ["wheelguard"]
