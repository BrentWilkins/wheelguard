[project]
site_name = "Wheelguard User Guide"
site_description = "Use a policy-aware Python package service with uv and pip."
site_author = "Wheelguard contributors"
repo_url = "https://github.com/BrentWilkins/wheelguard"
repo_name = "BrentWilkins/wheelguard"
edit_uri = "edit/main/docs/"
copyright = "Copyright &copy; 2026 Wheelguard contributors"

nav = [
  { "Why Wheelguard" = "index.md" },
  { "Get started" = "getting-started.md" },
  { "Publish in-house packages" = "publishing.md" },
  { "Deploy on Azure" = "azure-deployment.md" },
  { "Reliability and trust" = "reliability.md" },
]

[project.theme]
language = "en"
features = [
  "content.code.copy",
  "content.code.select",
  "navigation.footer",
  "navigation.instant",
  "navigation.sections",
  "navigation.top",
  "search.highlight",
]

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

[project.markdown_extensions]
admonition = {}
attr_list = {}
pymdownx.details = {}
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.line_spans = "__span"
pymdownx.highlight.pygments_lang_class = true
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
pymdownx.tabbed.alternate_style = true
toc.permalink = true
